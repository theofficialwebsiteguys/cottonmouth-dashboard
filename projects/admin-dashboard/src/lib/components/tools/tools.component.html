<div class="page-shell tools-shell">

  <!-- HEADER -->
  <div class="page-header">
    <div>
      <h1>Admin Tools</h1>
      <p>Manage messaging, content, events, and delivery settings</p>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button *ngFor="let tab of tabs; let i = index" [class.active]="selectedTab === i" (click)="selectedTab = i">
      {{ tab }}
    </button>
  </div>

  <section class="workspace">

    <ng-container *ngIf="selectedTab === 0">

      <div class="grid two">

        <app-push-notification-tool></app-push-notification-tool>

      </div>
    </ng-container>

    <ng-container *ngIf="selectedTab === 1">

      <div class="card full">
        <div class="card-header">
          <h2>Homepage Banners</h2>
          <span class="muted">Manage carousel images</span>
        </div>

        <div class="banner-grid">
          <div *ngFor="let image of carouselImages; let i = index" class="banner-card">
            <div class="banner-preview">
              <img [src]="image" alt="Banner {{ i + 1 }}" />
            </div>

            <div class="banner-footer">
              <span class="banner-label">Banner {{ i + 1 }}</span>
            </div>

            <div class="banner-overlay">
              <label class="btn ghost small">
                Replace
                <input type="file" hidden (change)="onImageFileSelected($event, i)" />
              </label>

              <button class="btn danger small" (click)="deleteImage(i)">
                Delete
              </button>
            </div>
          </div>

          <!-- ADD NEW BANNER TILE -->
          <div class="banner-card add">
            <label class="add-banner">
              <input type="file" hidden (change)="onAddBannerFileSelected($event)" />
              <div class="add-inner">
                <div class="plus">＋</div>
                <div class="add-title">Add Banner</div>
                <div class="add-sub">
                  {{ addBannerFile?.name || 'PNG / JPG recommended' }}
                </div>
              </div>
            </label>

            <button class="btn primary small upload-btn" (click)="uploadNewBanner()" [disabled]="!addBannerFile">
              Upload
            </button>
          </div>
        </div>


      </div>
    </ng-container>

    <ng-container *ngIf="selectedTab === 2">
      <app-announcements></app-announcements>
    </ng-container>



  </section>
</div>
