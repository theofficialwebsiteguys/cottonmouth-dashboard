<div class="page-shell users-shell">

  <!-- HEADER -->
  <div class="users-header">
    <div class="header-title">
      <h1>Users</h1>
      <span class="user-count">{{ filteredUsers.length | number }} users</span>
    </div>

    <div class="header-controls">
      <div class="search-wrapper">
       <input
            type="text"
            placeholder="Search by name or email"
            [(ngModel)]="searchTerm"
            />
      </div>

      <button class="export-btn" (click)="exportToCSV()">
        Export
      </button>
    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="users-table-card" *ngIf="!selectedUser">

    <!-- TABLE HEADER -->
    <div class="table-header">
      <span>ID</span>
      <span>User</span>
      <span>Phone</span>
      <span>Points</span>
      <span>Avg Spend</span>
      <span>Total Spent</span>
      <span>Joined</span>
    </div>

    <!-- TABLE BODY -->
    <div class="table-body">
      <div
        class="table-row"
        *ngFor="let user of displayedUsers"
        (click)="selectUser(user)"
      >
        <span class="mono">#{{ user.id }}</span>

        <span class="user">
          {{ user.fname }} {{ user.lname }}
          <small>{{ user.email }}</small>
        </span>

        <span>{{ user.phone || '—' }}</span>

        <span class="points">{{ user.points }}</span>

        <span class="total">${{ user.averageSpend }}</span>

        <span class="total">${{ user.totalSpent }}</span>

        <span class="date">
          {{ user.createdAt | date:'shortDate' }}
        </span>
      </div>
    </div>

  </div>

  <!-- DETAILS -->
  <lib-user-detail
    *ngIf="selectedUser && !selectedOrder"
    [user]="selectedUser"
    (closeDetail)="closeDetail()"
    (orderSelected)="selectOrder($event)">
  </lib-user-detail>

  <lib-order-details
    *ngIf="selectedUser && selectedOrder"
    [order]="selectedOrder"
    (back)="closeDetail()">
  </lib-order-details>

</div>
